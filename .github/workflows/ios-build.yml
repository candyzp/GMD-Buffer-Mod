name: Build iOS port
# Build the consolidated default branch for iOS-targeted changes.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'mod.json'
      - 'CMakeLists.txt'
      - '.github/workflows/ios-build.yml'

jobs:
  build-ios:
    name: Build iOS mod (Geometry Dash 2.2081)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify Geometry Dash target
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          gd = json.loads(Path("mod.json").read_text())["gd"]
          assert gd.get("ios") == "2.2081", (
              f"Expected iOS target 2.2081, got {gd.get('ios')!r}"
          )
          assert gd.get("ios") != "2.2091", "Do not build this port against iOS 2.2091"
          print("Confirmed: iOS target is Geometry Dash 2.2081")
          PY

      - name: Build iOS mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: iOS
          # Keep SDK 5.11.2 paired with the bindings/codegen revision used by
          # this branch's known-good Windows build; do not silently follow the
          # moving bindings main branch.
          bindings-ref: 1605f500d053f8de122bf5c7dc6d17c24866e02e
          configure-args: -DSKIP_BUILDING_CODEGEN=OFF
          build-config: Release

      - name: Upload iOS package
        uses: actions/upload-artifact@v7
        with:
          name: Input-Buffer-iOS-GD-2.2081
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
