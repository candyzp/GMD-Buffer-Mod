name: Build iOS port

on:
  workflow_dispatch:
  push:
    branches:
      - ios-port

jobs:
  build-ios:
    name: Build for Geometry Dash iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify Geometry Dash target
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          gd = json.loads(Path("mod.json").read_text())["gd"]
          assert gd.get("ios") == "2.2081", (
              f"Expected iOS target 2.2081, got {gd.get('ios')!r}"
          )
          assert gd.get("ios") != "2.2091", "Do not build this port against iOS 2.2091"
          print("Confirmed: iOS target is Geometry Dash 2.2081")
          PY

      - name: Build iOS mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: iOS
          build-config: RelWithDebInfo

      - name: Upload iOS package
        uses: actions/upload-artifact@v7
        with:
          name: Input-Buffer-iOS
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
